  <text x="1355" y="415" class="subheading">Business PC - separate IT access</text>
  <text x="1355" y="440" class="small">Email / office / non-operational work</text>
  <text x="1355" y="463" class="small">Real-site context; no plant-control access</text>
  <rect x="1350" y="475" width="380" height="28" rx="5" class="security"/>
  <text x="1360" y="495" class="small">Azure Monitor Agent (AMA)</text>
  <rect x="1350" y="510" width="380" height="28" rx="5" class="security"/>
  <text x="1360" y="530" class="small">Microsoft Defender for Endpoint</text>
  <use href="#person" x="1155" y="425" class="person"/>
  <text x="1155" y="490" text-anchor="middle" class="small">Business user</text>
