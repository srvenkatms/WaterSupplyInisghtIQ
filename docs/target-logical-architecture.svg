  <rect x="1305" y="1480" width="440" height="95" rx="10" class="box"/>
  <text x="1325" y="1510" class="subheading">Approved incident sharing</text>
  <text x="1325" y="1539" class="small">Utility / designated state contacts / CISA</text>
  <path d="M525 1528H665" class="access-line"/>
  <path d="M1165 1528H1305" class="line"/>
  <text x="55" y="1595" class="small">No agent PLC writes or host administration. Sharing requires verified recipients + human approval. IoT Hub remains optional.</text>
  </g>
  <g id="cyber-flow-connectors">
    <title>Cyber input and reviewed output, routed outside component boxes</title>
    <path id="cyber-input" d="M1100 1340V1385H1785V1580H1225V1590" class="security-line"/>
    <text x="1800" y="1420" class="small">
      <tspan x="1800" dy="0">INPUT</tspan>
      <tspan x="1800" dy="25">Supported security</tspan>
      <tspan x="1800" dy="25">detections / evidence</tspan>
      <tspan x="1800" dy="25">Sentinel / Defender</tspan>
      <tspan x="1800" dy="25">Not all workspace data</tspan>
    </text>
    <path id="cyber-output" d="M1225 1700V1735H450V1745" class="security-line" stroke-dasharray="7 5"/>
    <path id="case-to-portal" d="M320 1815V1830H-10V2008H915V2020" class="line"/>
  </g>
  <path d="M-190 100H-135" class="access-line"/>
  <text x="-200" y="133" class="small">Human access</text>
  <text x="-200" y="157" class="small">Not telemetry</text>
  <g id="collection-notes" transform="translate(0 140)">
  <rect x="35" y="2060" width="1730" height="225" rx="14" fill="#fcf9ff" stroke="#9775b3" stroke-width="2"/>
  <text x="55" y="2095" class="heading">WHAT THE SOFTWARE INSIDE EACH PC COLLECTS - planned, not installed</text>
  <text x="55" y="2128" class="subheading">Azure Monitor Agent (AMA)</text>
  <text x="55" y="2155" class="small">Selected Windows event logs: successful/failed logons, RDP access, system/application errors and enabled audit events selected by DCRs.</text>
  <text x="55" y="2188" class="subheading">Microsoft Defender for Endpoint</text>
  <text x="55" y="2215" class="small">Endpoint alerts and selected evidence about suspicious programs, malware, files and network activity; coverage depends on policy and licensing.</text>
  <text x="55" y="2248" class="small">Server-based plant VM: supported AMA VM extension. Business Windows client: supported AMA client installer / prerequisites must be validated.</text>
  <text x="55" y="2275" class="small">Each PC is onboarded separately; AMA uses Monitor ingestion, Defender uses its supported cloud service. Neither is one of the four AI agents.</text>
  </g>
</svg>
