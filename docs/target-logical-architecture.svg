  <text x="35" y="77" class="body">PROPOSED / NOT DEPLOYED | Local control stays local | Utility process reasoning + separate Perception blue cyber lane</text>

  <rect x="35" y="110" width="1730" height="475" rx="16" fill="#eff9f3" stroke="#4f9271" stroke-width="2"/>
