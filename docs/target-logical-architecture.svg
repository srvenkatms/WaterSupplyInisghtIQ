  <text x="75" y="440" class="small">HMI browser / approved plant apps</text>
  <text x="75" y="463" class="small">vm-tgt-operator / Windows</text>
  <rect x="70" y="475" width="270" height="28" rx="5" class="security"/>
  <text x="80" y="495" class="small">Azure Monitor Agent (AMA)</text>
  <rect x="70" y="510" width="270" height="28" rx="5" class="security"/>
  <text x="80" y="530" class="small">Microsoft Defender for Endpoint</text>
