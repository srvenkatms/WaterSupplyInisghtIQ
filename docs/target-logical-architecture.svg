  <path d="M205 310V530H25V695H55" class="security-line"/>
  <path d="M1540 310V530H25" fill="none" stroke="#73539b" stroke-width="2.6"/>
  <text x="520" y="550" class="small">Each PC sends its own agent evidence through the firewall</text>
  <rect x="605" y="615" width="430" height="120" rx="10" class="box"/>
  <text x="625" y="645" class="subheading">Site VPN + Azure VPN gateway</text>
  <text x="625" y="674" class="small">IPsec / scoped machine identities / TLS</text>
  <text x="625" y="703" class="small">Private process and AMA ingestion</text>
  <path d="M475 675H605" class="line"/>
  <text x="491" y="700" class="small">Site tunnel</text>
