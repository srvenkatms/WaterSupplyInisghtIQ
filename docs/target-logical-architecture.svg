  <text x="75" y="968" class="small">Private endpoints / source identity / quality checks</text>
  <rect x="665" y="880" width="500" height="120" rx="10" class="box"/>
  <text x="685" y="910" class="subheading">Log Analytics + Microsoft Sentinel</text>
  <text x="685" y="939" class="small">Process and security evidence / asset context</text>
  <text x="685" y="968" class="small">Deterministic alerts continue without AI</text>
  <rect x="1305" y="880" width="440" height="120" rx="10" class="security"/>
  <text x="1325" y="910" class="subheading">Native security integrations</text>
  <text x="1325" y="939" class="small">Entra sign-in logs / Defender evidence</text>
  <text x="1325" y="968" class="small">Cloud-generated records via native connectors</text>
  <path d="M820 635V700H290V880" class="line"/>
  <path d="M1455 635V750H1525V880" class="security-line"/>
  <text x="1540" y="799" class="small">Cloud evidence</text>
  <path d="M915 795V805H1220V980H1165" class="security-line"/>
  <path d="M525 940H665" class="line"/>
  <path d="M1305 940H1165" class="security-line"/>
  </g>

  <g id="iq-layer">
  <title>Utility IQ shared context layer</title>
  <desc>The existing utility API combines authorized evidence queries, reviewed asset relationships and approved knowledge. This logical capability supports the four agents without new equipment-control paths or an additional deployment service.</desc>
  <path d="M915 1370V1400" class="line"/>
  <rect x="35" y="1400" width="1730" height="100" rx="14" fill="#fff8e9" stroke="#b48b39" stroke-width="2"/>
  <text x="55" y="1428" class="heading">UTILITY IQ LAYER - shared context via the existing utility API and stores</text>
  <text x="55" y="1458" class="small">WHAT: ontology / canonical IDs / typed relationships / approved runbooks. WHY: relate process, security, identity and maintenance evidence.</text>
  <text x="55" y="1485" class="small">HOW: scoped API + versioned Cosmos context + Log Analytics evidence + cited retrieval. Fabric optional; no inferred causation from timing alone.</text>
  </g>

  <g id="agent-layer" transform="translate(0 440)">
  <rect x="35" y="1090" width="1730" height="420" rx="16" fill="#eff9f3" stroke="#4f9271" stroke-width="2"/>
  <text x="55" y="1124" class="heading">UTILITY ADVISORY PLATFORM - four custom agents + Microsoft-managed Perception blue</text>
  <rect x="55" y="1150" width="300" height="110" rx="10" class="box"/>
  <text x="75" y="1182" class="subheading">Exposure Assessor</text>
  <text x="75" y="1211" class="small">Read-only configuration</text>
  <text x="75" y="1236" class="small">and coverage review</text>
  <rect x="395" y="1150" width="300" height="110" rx="10" class="box"/>
  <text x="415" y="1182" class="subheading">Operator Coach</text>
  <text x="415" y="1211" class="small">Cited operator guidance</text>
  <text x="415" y="1236" class="small">Approved procedures</text>
  <rect x="735" y="1150" width="300" height="110" rx="10" class="box"/>
  <text x="755" y="1182" class="subheading">Monitoring Agent</text>
  <text x="755" y="1211" class="small">Process / evidence quality</text>
  <text x="755" y="1236" class="small">Operational impact</text>
  <rect x="1415" y="1150" width="330" height="110" rx="10" class="box"/>
  <text x="1435" y="1182" class="subheading">Response Coordinator</text>
  <text x="1435" y="1211" class="small">Cases / timeline</text>
  <text x="1435" y="1236" class="small">Escalation drafts</text>
  <rect x="55" y="1305" width="530" height="70" rx="10" class="box"/>
  <text x="75" y="1334" class="subheading">Utility-scoped query / case API</text>
  <text x="75" y="1360" class="small">Server-enforced role, utility and bounded tool permissions</text>
  <rect x="665" y="1305" width="1080" height="70" rx="10" class="box"/>
  <text x="685" y="1334" class="subheading">Shared services with explicit authorization</text>
  <text x="685" y="1360" class="small">Custom agents call Foundry; API mediates Search / Cosmos DB / Blob evidence / work queues</text>
  <path d="M205 1260V1305" class="line"/>
  <path d="M545 1260V1270H290V1305" class="line"/>
  <path d="M885 1260V1278H360V1305" class="line"/>
  <path d="M1580 1260V1285H550V1305" class="line"/>
  <path d="M585 1340H665" class="line"/>
  <path d="M55 1340H20V1075H915V1060" class="line"/>
  <text x="950" y="1080" class="small">API queries IQ context; no direct PLC or broad data credentials</text>
  <g id="perception-lane">
    <title>Microsoft-managed cyber capability within the logical utility advisory platform: proposed, not enabled</title>
    <desc>Perception blue triage and investigation use supported security evidence, not assumed custom PLC or Cosmos access. Core and blue capabilities are GA per Microsoft's November 17, 2026 announcement; external APIs and MCP integration remain preview. Initial handoff is an authorized analyst recording a reviewed finding in the private case API. Automated synchronization requires separate acceptance. No red or green handoffs or plant actions are authorized.</desc>
    <rect x="1075" y="1150" width="300" height="110" rx="10" class="security"/>
    <text x="1095" y="1182" class="subheading">Perception blue</text>
    <text x="1095" y="1211" class="small">Cyber triage / investigation</text>
    <text x="1095" y="1236" class="small">Microsoft-managed capability</text>
  </g>
  <text x="700" y="1410" class="small">Purple dashed output: analyst-reviewed finding to case API; automated adapter gated.</text>
  <text x="55" y="1445" class="small">Perception: supported Sentinel / Defender security coverage only, not automatic access to every Log Analytics table or custom PLC sample.</text>
  <text x="55" y="1470" class="small">Core / blue GA (Nov 17, 2026); external MCP / APIs preview. Purple = Microsoft-managed, outside our Container Apps / VNet; adoption gate applies.</text>
  <text x="55" y="1495" class="small">No red / green handoffs, PLC writes, host isolation or plant administration. Missing cyber coverage stays visible; local control stays independent.</text>
  </g>

  <g id="operator-layer" transform="translate(0 540)">
